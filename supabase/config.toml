project_id = "regrowth-conference-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/auth-callback",
  "https://app.regrowth.au/auth-callback",
  "regrowth://auth-callback",
  "exp://localhost:8081",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
# Open email + password sign-up (decided 2026-09-29). Sign-up links an account
# to its registrations by email, so email confirmation must stay on.
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
